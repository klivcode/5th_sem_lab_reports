<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 6 - Images and Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery">
        <h2>Image Gallery Showcase</h2>
        <div class="image-grid">
            <!-- Using placeholder images for demonstration -->
            <div class="img-card">
                <img src="https://picsum.photos/300/200?random=1" alt="Random Image 1">
                <p>Nature View</p>
            </div>
            <div class="img-card">
                <img src="https://picsum.photos/300/200?random=2" alt="Random Image 2">
                <p>City Landscape</p>
            </div>
            <div class="img-card">
                <img src="https://picsum.photos/300/200?random=3" alt="Random Image 3">
                <p>Technology</p>
            </div>
        </div>
    </div>
</body>
</html>
