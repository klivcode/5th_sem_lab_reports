<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 3 - Form Validation</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .form-box { background: #fff; padding: 20px; border-radius: 5px; width: 300px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; }
        .error { color: red; font-size: 0.9em; display: none; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Register</h2>
        <form id="valForm" onsubmit="return validateForm()">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username">
                <div id="userError" class="error">Username must be at least 4 characters.</div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password">
                <div id="passError" class="error">Password must start with digit and end with #.</div>
            </div>
            <div class="form-group">
                <label>Education</label>
                <input type="checkbox" name="edu" value="hs"> High School
                <input type="checkbox" name="edu" value="bachelors"> Bachelors
                <div id="eduError" class="error">Select at least one education field.</div>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
