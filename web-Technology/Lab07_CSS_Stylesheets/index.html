<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 7 - CSS Stylesheets</title>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Internal CSS -->
    <style>
        .internal-style {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 8px;
            margin: 20px auto;
            width: 80%;
        }
    </style>
</head>
<body>
    <div class="internal-style">
        <!-- Inline CSS -->
        <h1 style="color: #e74c3c; text-align: center; font-family: 'Courier New', Courier, monospace;">
            Demonstrating CSS Types
        </h1>
        
        <p>This page uses an external stylesheet for the background, internal styles for this white box, and inline styles for the heading above.</p>
        
        <div class="link-demo">
            <h3>Link States Demonstration</h3>
            <a href="https://example.com" target="_blank" class="custom-link">Visit Example.com</a>
        </div>
    </div>
</body>
</html>
