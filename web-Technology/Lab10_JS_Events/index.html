<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 10 - Event Handling</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9;}
        #interactiveBox {
            width: 300px;
            height: 200px;
            background-color: #3498db;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            transition: all 0.3s;
            text-align: center;
            padding: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="interactiveBox">Hover over me!</div>

    <script src="script.js"></script>
</body>
</html>
